<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-lungs"></i> Флюорография 2026
            </h1>
            <button onclick="toggleAdmin()" class="bg-indigo-800 hover:bg-indigo-900 text-sm px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-lock"></i> Админ
            </button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Секция выбора и поиска -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Отметить прохождение флюорографии</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Курс:</label>
                    <select id="courseSelect" onchange="updateGroups()" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="1">1 Курс</option>
                        <option value="2">2 Курс</option>
                        <option value="3">3 Курс</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Группа:</label>
                    <select id="groupSelect" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <!-- Заполняется динамически -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Поиск по ФИО или ID:</label>
                    <input type="text" id="searchInput" placeholder="Введите имя или ID..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <!-- Список студентов -->
            <div id="studentsList" class="divide-y divide-gray-100 max-h-96 overflow-y-auto border border-gray-100 rounded-xl p-2">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- Панель Администратора -->
        <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700"><i class="fa-solid fa-chart-pie text-indigo-600"></i> Общая статистика</h2>
                <div class="flex gap-3 items-center"><button onclick="exportCSV()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">Экспорт CSV</button><button onclick="resetData()" class="text-red-600 hover:text-red-800 text-sm font-medium">Сбросить все статусы</button></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                    <p class="text-xs text-indigo-500 font-semibold uppercase">Всего студентов</p>
                    <p id="totalCount" class="text-2xl font-bold text-indigo-700">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                    <p class="text-xs text-green-500 font-semibold uppercase">Прошли</p>
                    <p id="passedCount" class="text-2xl font-bold text-green-700">0</p>
                </div>
                <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                    <p class="text-xs text-orange-500 font-semibold uppercase">Осталось</p>
                    <p id="leftCount" class="text-2xl font-bold text-orange-700">0</p>
                </div>
            </div>

            <div class="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-green-600 h-4 transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-500 text-right">0% выполнено</p>
        </div>

    </main>

        "name": "Токтобекова Бегаим Нурдиновна",
        "course": "3",
        "group": "MAR24C",
        "passed": false,
        "curator": "Гульнура Дыйканбаева"
    },
    {
        "id": "248714062",
        "name": "Юсупов Ильмар Тахирович",
        "course": "3",
        "group": "MAR24C",
        "passed": false,
        "curator": "Гульнура Дыйканбаева"
    }
];

        // Группы формируются из реального списка студентов Excel
        const groupsByCourse = Object.fromEntries(['1','2','3'].map(course => [
            course,
            [...new Set(studentsData.filter(s => s.course === course).map(s => s.group))].sort((a,b) => a.localeCompare(b, 'ru'))
        ]));

        let savedStatuses = JSON.parse(localStorage.getItem('fluoro_statuses')) || {};
        studentsData.forEach(s => {
            if (savedStatuses[s.id] !== undefined) s.passed = savedStatuses[s.id];
        });

        const courseSelect = document.getElementById('courseSelect');
        const groupSelect = document.getElementById('groupSelect');
        const searchInput = document.getElementById('searchInput');
        const studentsList = document.getElementById('studentsList');

        function updateGroups() {
            const course = courseSelect.value;
            const groups = groupsByCourse[course] || [];
            
            groupSelect.innerHTML = '';
            const allOpt = document.createElement('option');
            allOpt.value = '__ALL__';
            allOpt.textContent = 'Все группы';
            groupSelect.appendChild(allOpt);
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                groupSelect.appendChild(opt);
            });
            renderStudents();
        }

        function renderStudents() {
            const course = courseSelect.value;
            const group = groupSelect.value;
            const query = searchInput.value.toLowerCase().trim();

            studentsList.innerHTML = '';

            const filtered = studentsData.filter(s => {
                const matchCourse = s.course === course;
                const matchGroup = group === '__ALL__' || s.group === group;
                const matchQuery = s.name.toLowerCase().includes(query) || s.id.includes(query);
                return matchCourse && matchGroup && matchQuery;
            });

            if (filtered.length === 0) {
                studentsList.innerHTML = '<p class="text-center text-gray-400 py-4">Студенты не найдены</p>';
                updateAdminStats();
                return;
            }

            filtered.forEach(student => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between py-3 px-2 hover:bg-gray-50 rounded-lg transition";
                
                const safeId = String(student.id).replace(/[^0-9]/g, '');
                div.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-3 py-3 px-2 hover:bg-gray-50 rounded-lg transition";
                div.innerHTML = `
                    <div class="min-w-0">
                        <p class="font-medium text-gray-800">${escapeHtml(student.name)}</p>
                        <p class="text-xs text-gray-500 mt-1">ID: ${escapeHtml(student.id)} | Группа: <strong>${escapeHtml(student.group || 'Не указана')}</strong></p>
                        <p class="text-xs text-gray-500 mt-1">Куратор: <strong>${escapeHtml(student.curator || 'Не указан')}</strong></p>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button type="button" onclick="setPassed('${safeId}', true)" aria-pressed="${student.passed === true}" class="px-3 py-2 rounded-lg text-sm font-medium transition ${student.passed === true ? 'bg-green-600 text-white ring-2 ring-green-200' : 'bg-green-50 text-green-700 hover:bg-green-100 border border-green-200'}">
                            <i class="fa-solid fa-check"></i> Прошел
                        </button>
                        <button type="button" onclick="setPassed('${safeId}', false)" aria-pressed="${student.passed === false}" class="px-3 py-2 rounded-lg text-sm font-medium transition ${student.passed === false ? 'bg-red-600 text-white ring-2 ring-red-200' : 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200'}">
                            <i class="fa-solid fa-xmark"></i> Не прошел
                        </button>
                    </div>
                `;
                studentsList.appendChild(div);
            });

            updateAdminStats();
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        // Два отдельных действия: установить статус «Прошел» или «Не прошел»
        function setPassed(id, value) {
            const student = studentsData.find(s => String(s.id) === String(id));
            if (!student) return;
            student.passed = value;
            savedStatuses[student.id] = value;
            localStorage.setItem('fluoro_statuses', JSON.stringify(savedStatuses));
            renderStudents();
        }

        function updateAdminStats() {
            const total = studentsData.length;
            const passed = studentsData.filter(s => s.passed).length;
            const left = total - passed;
            const percent = total > 0 ? Math.round((passed / total) * 100) : 0;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('passedCount').innerText = passed;
            document.getElementById('leftCount').innerText = left;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '% выполнено';
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const password = prompt('Введите пароль администратора:');
                if (password === 'nurzada123' || password === 'admin') {
                    panel.classList.remove('hidden');
                } else if (password !== null) {
                    alert('Неверный пароль!');
                }
            } else {
                panel.classList.add('hidden');
            }
        }


        function exportCSV() {
            const rows = [['ID', 'ФИО', 'Курс', 'Группа', 'Куратор', 'Флюорография']];
            studentsData.forEach(s => rows.push([s.id, s.name, s.course, s.group, s.curator || 'Не указан', s.passed ? 'Прошел' : 'Не прошел']));
            const csv = '\uFEFF' + rows.map(row => row.map(value => '"' + String(value).replace(/"/g, '""') + '"').join(';')).join('\r\n');
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'fluorography_statuses.csv'; a.click();
            URL.revokeObjectURL(url);
        }

        function resetData() {
            if (confirm('Сбросить все статусы?')) {
                localStorage.removeItem('fluoro_statuses');
                studentsData.forEach(s => s.passed = false);
                savedStatuses = {};
                renderStudents();
            }
        }

        courseSelect.addEventListener('change', updateGroups);
        groupSelect.addEventListener('change', renderStudents);
        searchInput.addEventListener('input', renderStudents);

        // Инициализация при загрузке
        updateGroups();
    </script>
</body>
</html>
